<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agent-office · sprite sheet</title>
<style>
  body { margin: 0; padding: 16px; background: #e9d6b4; font: 12px/1.3 ui-monospace, Menlo, monospace; color: #3a2a20; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p { margin: 0 0 12px; }
  #grid { display: grid; grid-template-columns: 90px repeat(5, 136px); gap: 6px 8px; align-items: center; }
  .hd { font-weight: bold; text-align: center; }
  .role { font-weight: bold; text-align: right; padding-right: 6px; }
  canvas { image-rendering: pixelated; display: block; border-radius: 2px; }
</style>
</head>
<body>
<h1>agent-office sprite sheet (dev only)</h1>
<p>All roles × poses at 4× zoom, animated at ~6 fps. <code>?f=0..3</code> freezes a frame, <code>?z=8</code> zoom, <code>?roles=a,b</code> filter.</p>
<div id="grid"></div>
<script src="sprite-sheet.js"></script>
</body>
</html>
